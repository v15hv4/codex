name: rust-release

on:
  push:
    tags:
      - "rust-v*.*.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#rust-v}"
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml)"
          [[ "$tag_version" == "$workspace_version" ]] || {
            echo "Tag $tag_version does not match workspace version $workspace_version" >&2
            exit 1
          }
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcap-dev
      - name: Build release binaries
        run: make build
      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          archive="codex-x86_64-unknown-linux-gnu.tar.gz"
          tar -C codex-rs/target/release -czf "$archive" \
            codex codex-code-mode-host codex-responses-api-proxy
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          codex-x86_64-unknown-linux-gnu.tar.gz
          codex-x86_64-unknown-linux-gnu.tar.gz.sha256
          --verify-tag
          --generate-notes
          --latest
